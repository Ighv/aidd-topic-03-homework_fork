{% extends "dashboard/base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<h1>Добавить в список наблюдения</h1>
<form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Добавить</button>
</form>
<a href="{% url 'dashboard:watchlist' %}">Назад</a>
{% endblock %}
